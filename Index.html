<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja de los Recuerdos</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           CONFIGURACIÓN DE COLORES Y FUENTES
           ========================================= */
        :root {
            --color-fondo: #ffffff; 
            --color-botones: #54bfe2;
            --fuente-principal: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-fondo);
            font-family: var(--fuente-principal);
            overflow-x: hidden; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            padding: 20px 5%;
            display: flex;
            align-items: center;
            font-weight: 800;
            font-size: 1.5rem;
            z-index: 10;
        }

        header img {
            width: 35px;
            margin-right: 10px;
        }

        /* =========================================
           CONTENEDOR PRINCIPAL (2 COLUMNAS)
           ========================================= */
        .content-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Mitad y mitad en PC */
            gap: 40px;
            padding: 20px 8%;
            max-width: 1400px;
            margin: 0 auto;
            align-items: center; /* Centra ambos elementos verticalmente */
            width: 100%;
        }

        /* --- COLUMNA 1: INFORMACIÓN --- */
        .info-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            width: 100%;
            max-width: 450px;
            height: auto;
            display: block;
            margin-bottom: 20px;
            align-content: center;
        }

        .subtext {
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.2;
            margin-bottom: 30px;
            color: #bf6ca8;
            text-align: center;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;

        }

        .btn {
            background-color: var(--color-botones);
            color: #ffffff;
            text-decoration: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* --- COLUMNA 2: VIDEO --- */
        .video-column {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #characterVideo {
            width: 100%;
            max-width: 100%; /* Evita que sea gigantesco en PC */
            border-radius: 0px; /* Bordes redondeados para que se vea como un elemento UI */
            box-shadow: 0px 0px none; /* Sombra elegante */
            /*object-fit: cover;*/
            background-color: none; /* Fondo negro por si tarda en cargar */
        }

        /* PIE DE PÁGINA */
        footer {
            padding: 30px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
            color: #bf6ca8;
        }



        /* =========================================
           REGLAS PARA CELULARES (RESPONSIVE)
           ========================================= */
        @media screen and (max-width: 900px) {
            .content-grid {
                grid-template-columns: 1fr; /* Cambia a 1 sola columna (se apilan) */
                text-align: left; 
                padding: 20px 8% 40px; 
                gap: 40px; /* Espacio entre los botones y el video */
            }

            .info-column {
                order: 1; /* Asegura que la info vaya primero arriba */
            }

            .video-column {
                order: 2; /* Asegura que el video vaya debajo */
            }

            .logo-img {
                max-width: 200px; 
                margin-bottom: 15px;
            }

            .subtext {
                font-size: 1.1rem; 
                margin-bottom: 25px;
                max-width: 100%; 
            }

            .nav-buttons {
                max-width: 100%; /* Los botones ocupan todo el ancho en móvil */
            }

            .btn {
                font-size: 1rem; 
                padding: 14px; 
            }
            
            #characterVideo {
                max-width: 100%; /* El video toma el ancho de la pantalla */
                max-height: 400px; /* Limita la altura para no ocupar todo el celular */
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>


    <div class="content-grid">
        
        <div class="info-column">
            <img src="img/logo.png" alt="SECURE" class="logo-img"> 
            <p class="subtext">"Recordar no es retroceder,<br> es una forma de volver a estar"</p>
            
            <div class="nav-buttons">
                <a href="ra.html" class="btn">Realidad Aumentada</a> 
                <a href="juegos.html" class="btn">Juegos</a>          
                <a href="nosotros.html" class="btn">Nosotros</a>      
            </div>
        </div>

        <div class="video-column">
            <video id="characterVideo" autoplay muted playsinline>
                <source id="videoSource" src="ra/entrada_niño_(1).mp4" type="video/mp4">
                Tu navegador no soporta videos.
            </video>
        </div>

    </div>

    <footer>
        <p>© 2026 - satori</p>
    </footer>

    <script>
    // ============================================================
    // CONFIGURACIÓN DE RUTAS
    // ============================================================
    const RUTA_1 = "ra/entrada_niño_(1).mp4"; // <--- Cambia aquí al nombre de tu primer video
    const RUTA_2 = "ra/niño_dormir_(1).mp4"; // <--- Nombre corregido a 1 sola 'm'
    const RUTA_3 = "ra/despierta_el_niño_(1).mp4"; // <--- Cambia aquí al nombre de tu tercer video

    const miVideo = document.getElementById('characterVideo');
    const miSource = document.getElementById('videoSource');

    let videoActual = RUTA_1;
    miVideo.loop = false;

    function cambiarVideo(nuevaRuta, conBucle) {
        if (videoActual === nuevaRuta) return; 

        videoActual = nuevaRuta;
        miVideo.pause();
        miSource.setAttribute('src', nuevaRuta);
        miVideo.loop = conBucle; 
        miVideo.load();
        
        miVideo.play().catch(error => {
            console.log("El navegador requiere un clic para iniciar el video.");
        });
    }

    miVideo.onended = function() {
        if (videoActual === RUTA_1) {
            cambiarVideo(RUTA_2, true);
        }
        // PLAN DE RESPALDO: Si el navegador ignora el bucle de niño_dormir, lo forzamos
        else if (videoActual === RUTA_2) {
            miVideo.play();
        }
        else if (videoActual === RUTA_3) {
            cambiarVideo(RUTA_1, false);
        }
    };

    // Al hacer clic en cualquier parte de la pantalla, si el niño duerme, despierta
    document.addEventListener('click', function() {
        if (videoActual === RUTA_2) {
            cambiarVideo(RUTA_3, false);
        }
    });
    </script>
</body>
</html>
