<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Gigs - Realidad Aumentada</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #000; font-family: 'Montserrat', sans-serif; }

        /* Pantalla de Intro */
        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-color: #ffffff; 
            z-index: 9999; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Botón de retroceso */
        #back-btn {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 999;
            background-color: #54bfe2;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
        }

        /* Ocultar el botón de escaneo VR que a veces sale por defecto */
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <video id="intro-video" src="video/pantalla de carga_niño.mp4" autoplay muted playsinline></video>
    </div>

    <a href="index.html" id="back-btn">← Volver</a>

    <a-scene 
        mindar-image="imageTargetSrc: ar/tarjetas.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="ar-vid1" src="ra/realidad aumentada_niño_rayuela_final.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
            <video id="ar-vid2" src="video/reflexion.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target1">
            <a-plane position="0 0 0" scale="1.5 1 1" material="shader: chromakey; src: #ar-vid1; color: 0.1 0.9 0.2;"></a-plane>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1" id="target2">
            <a-plane position="0 0 0" scale="1.5 1 1" material="shader: chromakey; src: #ar-vid2; color: 0.1 0.9 0.2;"></a-plane>
        </a-entity>

    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const introScreen = document.getElementById('intro-screen');
            const introVideo = document.getElementById('intro-video');
            
            const target1 = document.getElementById('target1');
            const vid1 = document.getElementById('ar-vid1');
            
            const target2 = document.getElementById('target2');
            const vid2 = document.getElementById('ar-vid2');

            // ==========================================
            // LÓGICA DE TRANSICIÓN (2 Videos de Intro)
            // ==========================================
            
            // 🚨 ¡MODIFICA ESTA LÍNEA CON EL NOMBRE DE TU SEGUNDO VIDEO! 🚨
            const SEGUNDO_VIDEO = "video/tutorial_RA.mp4"; // <--- Cambia aquí al nombre de tu segundo video
            
            let faseIntro = 1; // Controla en qué video vamos

            if(introVideo) {
                introVideo.addEventListener('ended', function() {
                    
                    if (faseIntro === 1) {
                        // Terminó el primer video. Cambiamos al segundo.
                        introVideo.src = SEGUNDO_VIDEO;
                        introVideo.play();
                        faseIntro = 2; // Actualizamos la fase
                    } 
                    else if (faseIntro === 2) {
                        // Terminó el segundo video. Quitamos la pantalla verde y mostramos la AR.
                        introScreen.style.opacity = '0'; 
                        setTimeout(() => {
                            introScreen.style.display = 'none'; 
                        }, 500);
                    }
                    
                });
            }

            // ==========================================
            // LÓGICA DE REALIDAD AUMENTADA (MindAR)
            // ==========================================
            
            // Tarjeta 1
            if(target1 && vid1) {
                target1.addEventListener('targetFound', function() {
                    vid1.play();
                });
                target1.addEventListener('targetLost', function() {
                    vid1.pause();
                    vid1.currentTime = 0; 
                });
            }

            // Tarjeta 2
            if(target2 && vid2) {
                target2.addEventListener('targetFound', function() {
                    vid2.play();
                });
                target2.addEventListener('targetLost', function() {
                    vid2.pause();
                    vid2.currentTime = 0;
                });
            }

            // Solución para móviles (desbloquear audio/video al tocar)
            window.addEventListener('touchstart', function() {
                if(vid1) { vid1.play(); vid1.pause(); }
                if(vid2) { vid2.play(); vid2.pause(); }
            }, { once: true });
        });
    </script>
</body>
</html>
