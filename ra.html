<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Gigs - Realidad Aumentada</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #000; font-family: 'Montserrat', sans-serif; }

        /* Pantalla de Intro (Videos secuenciales) */
        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-color: #ffffff; 
            z-index: 9999; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Ajuste opcional para PC: max-width: 600px; border-radius: 12px; */
        }

        /* Botón de retroceso */
        #back-btn {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 999;
            background-color: #54bfe2;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
        }

        .a-enter-vr { display: none !important; }

        /* Ajuste responsive para el video de intro en celular */
        @media screen and (max-width: 768px) {
            #intro-video {
                max-width: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <video id="intro-video" src="video/pantalla_de_carga_niño.mp4" autoplay muted playsinline></video>
    </div>

    <a href="index.html" id="back-btn">← Volver</a>

    <a-scene 
        mindar-image="imageTargetSrc: ar/tarjetas.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="ar-vid1" src="ra/realidad_aumentada_final.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target1">
            <a-plane position="0 0 0" scale="1.5 1 1" material="shader: chromakey; src: #ar-vid1; color: 0.1 0.9 0.2;"></a-plane>
        </a-entity>

    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const introScreen = document.getElementById('intro-screen');
            const introVideo = document.getElementById('intro-video');
            
            const target1 = document.getElementById('target1');
            const vid1 = document.getElementById('ar-vid1');

            // ==========================================
            // LÓGICA DE TRANSICIÓN (2 Videos de Intro)
            // ==========================================
            
            // Define el segundo video que se reproducirá (tutorial)
            const SEGUNDO_VIDEO = "video/tutorial_RA.mp4"; 
            
            let faseIntro = 1; // Controla en qué video vamos

            if(introVideo) {
                // Cuando termina el video actual...
                introVideo.addEventListener('ended', function() {
                    
                    if (faseIntro === 1) {
                        // Terminó el primer video (carga). Cambiamos la fuente al segundo (tutorial).
                        introVideo.src = SEGUNDO_VIDEO;
                        introVideo.play(); // Reproducir el segundo video
                        faseIntro = 2; // Actualizamos la fase
                    } 
                    else if (faseIntro === 2) {
                        // Terminó el segundo video (tutorial).
                        // Ocultamos la pantalla de intro con una transición de opacidad.
                        introScreen.style.opacity = '0'; 
                        setTimeout(() => {
                            // Eliminamos el elemento del diseño para mostrar la cámara AR.
                            introScreen.style.display = 'none'; 
                        }, 500); // Duración de la transición CSS
                    }
                    
                });
            }

            // ==========================================
            // LÓGICA DE REALIDAD AUMENTADA (MindAR)
            // ==========================================
            
            // Eventos para la Tarjeta 1
            if(target1 && vid1) {
                // Cuando la cámara encuentra la tarjeta...
                target1.addEventListener('targetFound', function() {
                    vid1.play(); // Reproducir el video de la rayuela
                });
                // Cuando la cámara pierde la tarjeta...
                target1.addEventListener('targetLost', function() {
                    vid1.pause(); // Pausar el video
                    vid1.currentTime = 0; // Reiniciar el video al principio
                });
            }

            // Solución para móviles (desbloquear el video al primer toque)
            window.addEventListener('touchstart', function() {
                if(vid1) { vid1.play(); vid1.pause(); }
            }, { once: true }); // Solo se ejecuta una vez
        });
    </script>
</body>
</html>
